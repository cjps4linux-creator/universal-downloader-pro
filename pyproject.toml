[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-downloader-pro"
version = "1.0.0"
description = "Production-grade offline archiver and media downloader with privacy tunnel, knowledge pipeline, and batch queue"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Conrad CJ Wilson" }]
keywords = ["downloader", "archiver", "yt-dlp", "offline", "hermes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

dependencies = [
    "flask==3.0.3",
    "flask-cors==6.0.5",
    "requests==2.32.3",
    "curl-cffi==0.5.2",
    "beautifulsoup4==4.12.3",
    "yt-dlp==2026.08.19",
    "nh3==0.2.17",
    "cryptography==42.0.8",
    "keyring==25.3.0",
    "tenacity==8.2.3",
    "tqdm==4.66.5",
    "pdfplumber==0.11.4",
    "python-docx==1.1.2",
    "werkzeug==3.0.4",
    "jinja2==3.1.4",
    "markupsafe==2.1.5",
    "sqlalchemy==2.0.36",
    "browser-cookie3==0.19.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "pytest-httpserver==1.0.8",
    "schemathesis==3.35.2",
    "vcrpy==7.0.0",
    "hypothesis==6.111.1",
    "playwright==1.48.0",
    "pip-audit==2.7.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/udp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "docs/",
    "launcher/",
    "frontend/",
    "scripts/",
    "pyproject.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=udp --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/udp"]
omit = ["tests/*", "src/udp/cli.py"]

[tool.coverage.report]
# Ratcheting floor. The suite currently measures 39% of src/udp.
#
# The remaining uncovered code is dominated by the network downloader
# (core/downloader.py), the browser-cookie reader, the anti-block fetchers
# and the wireproxy tunnel — all of which need live network, a browser or a
# subprocess, none of which belong in a hermetic CI run.
#
# The security-critical modules are covered far above this floor:
#   models/db.py 91% · app.py 95% · utils/paths.py 100% · utils 83%
#   security/ssrf.py 81% · security/middleware.py 74% · core/assets.py 74%
#
# Raise this number as more of the download path gains test coverage.
fail_under = 35
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
