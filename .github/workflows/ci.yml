name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.17.1
      - name: Lint
        run: ruff check . --exclude .venv,venv,build,dist,node_modules

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install test dependencies
        # pytest-cov is required: pyproject.toml sets --cov=udp in addopts.
        run: pip install pytest==8.3.3 pytest-cov==5.0.0
      - name: Run tests
        run: pytest -q --no-header

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test -f README.md && echo "README present"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install jsdom
        run: npm install --no-save --no-fund --no-audit jsdom@25
      - name: Run frontend DOM tests
        run: node tests/frontend/kb-panel.test.js

  pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check dependency pins
        # Fails the build on a pre-release version specifier or a
        # toolchain version that has drifted from the validated pins.
        # See scripts/pin_guard.py.
        run: python scripts/pin_guard.py .
